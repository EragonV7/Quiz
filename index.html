<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Party - Controle do Jogador</title>

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0c20;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: #1a1532;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
        }

        h1, h2, h3 { text-align: center; font-weight: 700; }
        .title { color: #00f2fe; font-size: 24px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0,242,254,0.3); }

        #screen-login { display: flex; flex-direction: column; gap: 16px; }
        .avatar-upload { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .avatar-preview {
            width: 90px; height: 90px; border-radius: 50%; background: #282147;
            border: 3px solid #7928ca; display: flex; align-items: center;
            justify-content: center; overflow: hidden; font-size: 32px; color: #8a817c; cursor: pointer;
        }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
        
        input[type="file"] { display: none; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; color: #a0a0c0; font-weight: 600; }
        input[type="text"] {
            width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px solid #2d264f;
            background: #120e24; color: #fff; font-size: 16px; outline: none; transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #00f2fe; }

        .btn-primary {
            background: linear-gradient(135deg, #7928ca, #ff0080); color: white; border: none;
            padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,128,0.3); transition: transform 0.1s, opacity 0.2s; margin-top: 10px;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        #screen-game { display: none; flex-direction: column; gap: 16px; }
        .player-header { display: flex; align-items: center; justify-content: space-between; background: #231b42; padding: 12px 16px; border-radius: 16px; }
        .player-info { display: flex; align-items: center; gap: 10px; }
        
        .player-avatar-small { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: center; border: 2px solid #00f2fe; }
        .player-name { font-weight: 700; font-size: 15px; }

        .header-actions { display: flex; align-items: center; gap: 8px; }
        .btn-header-small { 
            background: #2a204a; border: 1px solid rgba(255,255,255,0.1); color: #fff; 
            padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; 
        }
        .btn-header-small:active { transform: scale(0.95); }
        .btn-logout { color: #ff4b4b; }

        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .status-waiting { background: rgba(255,193,7,0.2); color: #ffc107; }
        .status-active { background: rgba(0,242,254,0.2); color: #00f2fe; }
        .status-locked { background: rgba(255,75,75,0.2); color: #ff4b4b; }

        .buffs-section { background: #120e24; padding: 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .buffs-title { font-size: 12px; color: #a0a0c0; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .buffs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .buff-card {
            background: #221a3f; border: 1px solid #362a5f; border-radius: 10px; padding: 8px;
            text-align: center; font-size: 11px; cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .buff-card.selected { border-color: #00f2fe; background: rgba(0,242,254,0.15); box-shadow: 0 0 10px rgba(0,242,254,0.3); }
        .buff-card.used { opacity: 0.3; cursor: not-allowed; border-color: #444; filter: grayscale(100%); }
        .buff-icon { font-size: 18px; }

        .answers-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .btn-answer {
            width: 100%; padding: 18px; border-radius: 16px; border: none; color: white; font-size: 20px;
            font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.1s, opacity 0.2s;
        }
        .btn-answer:active { transform: scale(0.97); }
        .btn-answer:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(80%); }
        .btn-answer.hidden-5050 { display: none; }

        .btn-a { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-b { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .btn-c { background: linear-gradient(135deg, #f7971e, #ffd200); color: #111; }
        .btn-d { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .btn-e { background: linear-gradient(135deg, #8e2de2, #4a00e0); }

        .round-status { text-align: center; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.05); font-size: 14px; color: #d0d0f0; }

        /* MODAL DE CONFIRMAÇÃO DE BUFF */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background: #1a1532; padding: 24px; border-radius: 24px; width: 100%; max-width: 350px; border: 2px solid #362a5f; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .modal-icon { font-size: 48px; margin-bottom: 10px; }
        .modal-title { color: #00f2fe; margin-bottom: 8px; font-size: 22px; }
        .modal-desc { font-size: 14px; color: #d0d0f0; margin-bottom: 20px; line-height: 1.4; }
        .modal-target { margin-bottom: 20px; text-align: left; }
        .modal-target select { width: 100%; padding: 12px; border-radius: 12px; background: #231b42; color: #fff; border: 1px solid #00f2fe; font-size: 14px; outline: none; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-modal { flex: 1; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; transition: transform 0.1s; }
        .btn-modal:active { transform: scale(0.95); }
        .btn-modal-cancel { background: #2a204a; color: #fff; }
        .btn-modal-confirm { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #000; }

        /* DRAWER LATERAL (LISTA DE JOGADORES) */
        .drawer-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 900; }
        .drawer { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: #1a1532; box-shadow: -5px 0 20px rgba(0,0,0,0.7); z-index: 901; transition: right 0.3s ease; padding: 24px; display: flex; flex-direction: column; }
        .drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .drawer-close { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
        .drawer-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .player-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: #231b42; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .player-item img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .player-item-info { display: flex; flex-direction: column; }
        .player-item-name { font-size: 14px; font-weight: 600; }
        .player-item-badge { font-size: 10px; color: #00f2fe; font-weight: 700; }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- TELA DE LOGIN -->
        <div id="screen-login">
            <h1 class="title">QUIZ PARTY 🎮</h1>
            <h2>Criar Perfil</h2>
            <div class="avatar-upload">
                <div class="avatar-preview" onclick="document.getElementById('file-avatar').click()">
                    <span id="avatar-placeholder">📷</span>
                    <img id="avatar-img" style="display:none;" alt="Preview" />
                </div>
                <label>Toque para escolher sua foto</label>
                <input type="file" id="file-avatar" accept="image/*" onchange="previewAvatar(event)">
            </div>
            <div class="input-group">
                <label>Seu Nome ou Apelido</label>
                <input type="text" id="input-name" placeholder="Ex: Joãozinho123" maxlength="15">
            </div>
            <button class="btn-primary" id="btn-join" onclick="entrarNoJogo()">ENTRAR NO JOGO</button>
        </div>

        <!-- TELA DO JOGO -->
        <div id="screen-game">
            <div class="player-header">
                <div class="player-info">
                    <img id="p-avatar" class="player-avatar-small" src="" alt="Avatar" onerror="handleImageError(this)">
                    <span id="p-name" class="player-name">--</span>
                </div>
                <div class="header-actions">
                    <span id="p-status" class="status-badge status-waiting">Aguardando</span>
                    <button class="btn-header-small" onclick="abrirMenuJogadores()">👥</button>
                    <button class="btn-header-small btn-logout" onclick="sairDoPerfil()">Sair 🚪</button>
                </div>
            </div>

            <div class="round-status" id="round-info">Aguardando o host iniciar a próxima pergunta...</div>

            <div class="buffs-section">
                <div class="buffs-title">
                    <span>SEUS BUFFS</span>
                    <span id="buff-active-label" style="color:#00f2fe; font-weight:700;">6/6 disponíveis</span>
                </div>
                <div class="buffs-grid">
                    <div class="buff-card" id="buff-dobro" onclick="abrirModalBuff('dobro')">
                        <span class="buff-icon">⚡</span><span>Dobro/Nada</span>
                    </div>
                    <div class="buff-card" id="buff-escudo" onclick="abrirModalBuff('escudo')">
                        <span class="buff-icon">🛡️</span><span>Escudo</span>
                    </div>
                    <div class="buff-card" id="buff-vampiro" onclick="abrirModalBuff('vampiro')">
                        <span class="buff-icon">🧛</span><span>Vampiro</span>
                    </div>
                    <div class="buff-card" id="buff-maria" onclick="abrirModalBuff('maria')">
                        <span class="buff-icon">👯</span><span>Copiar</span>
                    </div>
                    <div class="buff-card" id="buff-chute" onclick="abrirModalBuff('chute')">
                        <span class="buff-icon">🎲</span><span>Chute Cego</span>
                    </div>
                    <div class="buff-card" id="buff-5050" onclick="abrirModalBuff('5050')">
                        <span class="buff-icon">✂️</span><span>50 / 50</span>
                    </div>
                </div>
            </div>

            <div class="answers-grid" id="answersGrid">
                <button class="btn-answer btn-a" onclick="enviarResposta('A')"><span>A</span> <span>&gt;</span></button>
                <button class="btn-answer btn-b" onclick="enviarResposta('B')"><span>B</span> <span>&gt;</span></button>
                <button class="btn-answer btn-c" onclick="enviarResposta('C')"><span>C</span> <span>&gt;</span></button>
                <button class="btn-answer btn-d" onclick="enviarResposta('D')"><span>D</span> <span>&gt;</span></button>
                <button class="btn-answer btn-e" onclick="enviarResposta('E')"><span>E</span> <span>&gt;</span></button>
            </div>
        </div>
    </div>

    <!-- MODAL DE BUFF -->
    <div class="modal-overlay" id="modalBuffOverlay">
        <div class="modal-box">
            <div class="modal-icon" id="modal-icon">⚡</div>
            <h3 class="modal-title" id="modal-title">Buff</h3>
            <p class="modal-desc" id="modal-desc">Descrição do buff.</p>
            
            <div class="modal-target" id="modal-target-container" style="display:none;">
                <label style="font-size: 13px; color: #00f2fe; margin-bottom: 6px; display: block; font-weight: 600;">Selecione quem quer afetar:</label>
                <select id="modal-select-target"></select>
            </div>

            <div class="modal-actions">
                <button class="btn-modal btn-modal-cancel" onclick="fecharModalBuff()">Cancelar</button>
                <button class="btn-modal btn-modal-confirm" onclick="confirmarBuff()">Usar Buff</button>
            </div>
        </div>
    </div>

    <!-- DRAWER DE JOGADORES -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="fecharMenuJogadores()"></div>
    <div class="drawer" id="drawerJogadores">
        <div class="drawer-header">
            <h3>Jogadores Online</h3>
            <button class="drawer-close" onclick="fecharMenuJogadores()">&times;</button>
        </div>
        <div class="drawer-content" id="lista-jogadores-online">
            <!-- Lista renderizada via JS -->
        </div>
    </div>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        const SUPABASE_URL = "https://azqtgvonviekeivefqde.supabase.co";
        const SUPABASE_KEY = "sb_publishable_U-C_YPVKJL48zEPdaQQGeg_nrE_F3Jm";
        
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        let jogadorAtual = null;
        let perguntaAtualId = null;
        let statusPartida = 'aguardando_jogadores';
        
        let buffSelecionado = null; // O buff que foi confirmado para a rodada atual
        let alvoSelecionado = null; // O alvo confirmado para a rodada atual
        let buffEmEdicao = null;    // O buff que está aberto no Modal no momento
        
        let respostaEnviada = false;
        let fileFoto = null;
        let canalRealtime = null;
        let buffsUsados = new Set();
        const TOTAL_BUFFS = 6;

        const DICIONARIO_BUFFS = {
            'dobro': { icon: '⚡', nome: 'Dobro ou Nada', desc: 'Se você acertar ganha o DOBRO de pontos! Se errar, perde o dobro.', precisaAlvo: false },
            'escudo': { icon: '🛡️', nome: 'Escudo Protetor', desc: 'Se você errar a questão ou for atacado por um vampiro, não perde nenhum ponto.', precisaAlvo: false },
            'vampiro': { icon: '🧛', nome: 'Ataque Vampiro', desc: 'Se você acertar a resposta, vai sugar pontos do jogador que você escolher.', precisaAlvo: true },
            'maria': { icon: '👯', nome: 'Maria Vai Com As Outras', desc: 'Não sabe a resposta? Copie automaticamente a opção que o alvo escolhido marcar.', precisaAlvo: true },
            'chute': { icon: '🎲', nome: 'Chute Cego', desc: 'O sistema escolherá uma resposta totalmente aleatória para você e enviará imediatamente.', precisaAlvo: false },
            '5050': { icon: '✂️', nome: '50 / 50', desc: 'O sistema removerá duas opções erradas da tela para facilitar sua escolha.', precisaAlvo: false }
        };

        // =========================================
        // INICIALIZAÇÃO & LOGIN
        // =========================================
        function getAvatarFallback(nome) {
            const inicial = (nome || '?').charAt(0).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
                <rect width="100%" height="100%" fill="#7928ca"/>
                <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="50" font-family="sans-serif" font-weight="bold">${inicial}</text>
            </svg>`;
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        function handleImageError(img) {
            if (jogadorAtual && jogadorAtual.nome) img.src = getAvatarFallback(jogadorAtual.nome);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const sessaoSalva = localStorage.getItem('quiz_party_jogador');
            if (sessaoSalva && supabaseClient) {
                try {
                    const playerLocal = JSON.parse(sessaoSalva);
                    const { data, error } = await supabaseClient.from('jogadores').select('*').eq('id', playerLocal.id).single();
                    if (data && !error) {
                        jogadorAtual = data;
                        iniciarTelaJogo();
                    } else {
                        localStorage.removeItem('quiz_party_jogador');
                    }
                } catch (err) {
                    localStorage.removeItem('quiz_party_jogador');
                }
            }
        });

        function previewAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                fileFoto = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('avatar-img').src = e.target.result;
                    document.getElementById('avatar-img').style.display = 'block';
                    document.getElementById('avatar-placeholder').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        async function entrarNoJogo() {
            if (!supabaseClient) return alert("Erro de conexão. Recarregue a página.");
            const nomeInput = document.getElementById('input-name').value.trim();
            const btnJoin = document.getElementById('btn-join');
            if (!nomeInput) return alert("Digite seu nome!");
            btnJoin.disabled = true;
            btnJoin.innerText = "ENTRANDO...";

            try {
                const { data: existente } = await supabaseClient.from('jogadores').select('*').ilike('nome', nomeInput).maybeSingle();
                let fotoUrl = (existente && existente.foto_url && !existente.foto_url.includes('placeholder')) ? existente.foto_url : getAvatarFallback(nomeInput);

                if (fileFoto) {
                    const fileName = `${Date.now()}_${nomeInput.toLowerCase().replace(/[^a-z0-9]/g, '')}.jpg`;
                    const { error: uploadError } = await supabaseClient.storage.from('fotos_perfil').upload(fileName, fileFoto);
                    if (!uploadError) {
                        const { data: pUrl } = supabaseClient.storage.from('fotos_perfil').getPublicUrl(fileName);
                        fotoUrl = pUrl.publicUrl;
                    }
                }

                let playerFinal = null;
                if (existente) {
                    const { data: updated } = await supabaseClient.from('jogadores').update({ foto_url: fotoUrl }).eq('id', existente.id).select().single();
                    playerFinal = updated;
                } else {
                    const { data: newPlayer } = await supabaseClient.from('jogadores').insert([{ nome: nomeInput, foto_url: fotoUrl }]).select().single();
                    playerFinal = newPlayer;
                }

                jogadorAtual = playerFinal;
                localStorage.setItem('quiz_party_jogador', JSON.stringify(playerFinal));
                iniciarTelaJogo();
            } catch (err) {
                alert("Erro: " + err.message);
                btnJoin.disabled = false;
                btnJoin.innerText = "ENTRAR NO JOGO";
            }
        }

        function sairDoPerfil() {
            if (canalRealtime) { supabaseClient.removeChannel(canalRealtime); canalRealtime = null; }
            localStorage.removeItem('quiz_party_jogador');
            jogadorAtual = null;
            document.getElementById('screen-game').style.display = 'none';
            document.getElementById('screen-login').style.display = 'flex';
            document.getElementById('btn-join').disabled = false;
            document.getElementById('btn-join').innerText = "ENTRAR NO JOGO";
            document.getElementById('input-name').value = '';
            document.getElementById('avatar-img').style.display = 'none';
            document.getElementById('avatar-placeholder').style.display = 'block';
            fileFoto = null;
        }

        // =========================================
        // JOGO & REALTIME
        // =========================================
        function iniciarTelaJogo() {
            document.getElementById('screen-login').style.display = 'none';
            document.getElementById('screen-game').style.display = 'flex';
            document.getElementById('p-name').innerText = jogadorAtual.nome;
            document.getElementById('p-avatar').src = jogadorAtual.foto_url || getAvatarFallback(jogadorAtual.nome);

            atualizarContadorBuffs();
            escutarEstadoPartida();
        }

        function escutarEstadoPartida() {
            if (canalRealtime) { supabaseClient.removeChannel(canalRealtime); canalRealtime = null; }
            canalRealtime = supabaseClient.channel('realtime_partida_' + Date.now())
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'partida_estado' }, payload => {
                    atualizarEstadoLocal(payload.new);
                }).subscribe();
            
            supabaseClient.from('partida_estado').select('*').eq('id', 1).single().then(({ data }) => {
                if (data) atualizarEstadoLocal(data);
            });
        }

        async function atualizarEstadoLocal(estado) {
            if (!estado) return;
            statusPartida = estado.status;
            perguntaAtualId = estado.pergunta_atual_id;

            const badge = document.getElementById('p-status');
            const info = document.getElementById('round-info');

            if (estado.status === 'aceitando_respostas') {
                if (perguntaAtualId !== window.perguntaAnteriorId) {
                    // RESET DA RODADA NOVA
                    respostaEnviada = false;
                    buffSelecionado = null;
                    alvoSelecionado = null;
                    atualizarContadorBuffs();
                    resetVisualBotoes();
                }
                window.perguntaAnteriorId = perguntaAtualId;
                badge.className = "status-badge status-active"; badge.innerText = "VALENDO";

                // Verifica se jogou offline
                const { data } = await supabaseClient.from('respostas_rodada').select('alternativa').eq('jogador_id', jogadorAtual.id).eq('pergunta_id', perguntaAtualId).maybeSingle();
                if (data) {
                    respostaEnviada = true;
                    setButtonsEnabled(false);
                    info.innerText = `Resposta já enviada [ ${data.alternativa} ]!`;
                } else {
                    info.innerText = "Escolha sua opção:";
                    setButtonsEnabled(true);
                }
            } else {
                fecharModalBuff(); // Força fechar modal se acabar o tempo
                badge.className = (estado.status === 'tempo_esgotado') ? "status-badge status-locked" : "status-badge status-waiting";
                badge.innerText = (estado.status === 'tempo_esgotado') ? "TRAVADO" : "AGUARDE";
                info.innerText = (estado.status === 'tempo_esgotado') ? "Tempo encerrado!" : "Aguardando próxima pergunta...";
                setButtonsEnabled(false);
            }
        }

        function setButtonsEnabled(enabled) {
            document.querySelectorAll('.btn-answer').forEach(b => {
                if (!b.classList.contains('hidden-5050')) b.disabled = !enabled;
            });
        }

        function resetVisualBotoes() {
            document.querySelectorAll('.btn-answer').forEach(b => { b.classList.remove('hidden-5050'); b.disabled = false; });
            document.querySelectorAll('.buff-card').forEach(c => {
                if (!buffsUsados.has(c.id.replace('buff-', ''))) c.classList.remove('selected');
            });
        }

        function atualizarContadorBuffs() {
            const disponiveis = TOTAL_BUFFS - buffsUsados.size;
            const label = document.getElementById('buff-active-label');
            if (buffSelecionado) label.innerText = `Buff ativo na rodada!`;
            else label.innerText = `${disponiveis}/${TOTAL_BUFFS} disponíveis`;
        }

        // =========================================
        // SISTEMA DE BUFFS (MODAL & CONFIRMAÇÃO)
        // =========================================
        async function abrirModalBuff(buffKey) {
            if (respostaEnviada || statusPartida !== 'aceitando_respostas') return;
            if (buffsUsados.has(buffKey)) return; // Já usou este buff no jogo
            if (buffSelecionado) return alert("Você já escolheu um buff para usar nesta rodada! Só é permitido 1 por rodada.");

            buffEmEdicao = buffKey;
            const info = DICIONARIO_BUFFS[buffKey];

            document.getElementById('modal-icon').innerText = info.icon;
            document.getElementById('modal-title').innerText = info.nome;
            document.getElementById('modal-desc').innerText = info.desc;

            const targetContainer = document.getElementById('modal-target-container');
            const selectTarget = document.getElementById('modal-select-target');
            
            if (info.precisaAlvo) {
                targetContainer.style.display = 'block';
                selectTarget.innerHTML = '<option value="">Carregando alvos...</option>';
                // Busca jogadores na hora
                const { data } = await supabaseClient.from('jogadores').select('id, nome').order('nome');
                selectTarget.innerHTML = '<option value="" disabled selected>-- Selecione um jogador --</option>';
                if (data) {
                    data.filter(j => j.id !== jogadorAtual.id).forEach(j => {
                        selectTarget.innerHTML += `<option value="${j.id}">${j.nome}</option>`;
                    });
                }
            } else {
                targetContainer.style.display = 'none';
            }

            document.getElementById('modalBuffOverlay').style.display = 'flex';
        }

        function fecharModalBuff() {
            buffEmEdicao = null;
            document.getElementById('modalBuffOverlay').style.display = 'none';
        }

        function confirmarBuff() {
            const key = buffEmEdicao;
            const info = DICIONARIO_BUFFS[key];

            if (info.precisaAlvo) {
                const alvoSelect = document.getElementById('modal-select-target').value;
                if (!alvoSelect) return alert("Você precisa selecionar um jogador alvo!");
                alvoSelecionado = alvoSelect;
            }

            // Buffs imediatos
            if (key === 'chute') {
                fecharModalBuff();
                executarChuteCego();
                return;
            }
            if (key === '5050') {
                fecharModalBuff();
                executar5050();
                return;
            }

            // Buffs passivos (esperam clicar na resposta)
            buffSelecionado = key;
            document.getElementById('buff-' + key).classList.add('selected');
            atualizarContadorBuffs();
            fecharModalBuff();
        }

        function executarChuteCego() {
            const opes = ['A', 'B', 'C', 'D', 'E'];
            buffSelecionado = 'chute'; // trava p/ insert
            enviarResposta(opes[Math.floor(Math.random() * opes.length)]);
        }

        function executar5050() {
            buffsUsados.add('5050');
            document.getElementById('buff-5050').classList.add('used');
            atualizarContadorBuffs();

            const btns = Array.from(document.querySelectorAll('.btn-answer')).sort(() => 0.5 - Math.random());
            btns[0].classList.add('hidden-5050');
            btns[1].classList.add('hidden-5050');
        }

        async function enviarResposta(alternativa) {
            if (respostaEnviada || statusPartida !== 'aceitando_respostas') return;

            respostaEnviada = true;
            setButtonsEnabled(false);
            document.getElementById('round-info').innerText = `Opção [ ${alternativa} ] enviada!`;

            const buffUsadoNesta = buffSelecionado;
            const alvoDesta = alvoSelecionado;

            // Marca visualmente como usado no perfil
            if (buffUsadoNesta) {
                buffsUsados.add(buffUsadoNesta);
                document.getElementById('buff-' + buffUsadoNesta).classList.remove('selected');
                document.getElementById('buff-' + buffUsadoNesta).classList.add('used');
                buffSelecionado = null; 
                alvoSelecionado = null;
                atualizarContadorBuffs();
            }

            // INSERE NO BANCO - ATENÇÃO: a tabela respostas_rodada agora precisará da coluna alvo_id
            await supabaseClient.from('respostas_rodada').insert([{
                jogador_id: jogadorAtual.id,
                pergunta_id: perguntaAtualId || 'Q_ATUAL',
                alternativa: alternativa,
                buff_usado: buffUsadoNesta,
                alvo_id: alvoDesta 
            }]);
        }

        // =========================================
        // DRAWER LATERAL (JOGADORES ONLINE)
        // =========================================
        async function abrirMenuJogadores() {
            document.getElementById('drawerOverlay').style.display = 'block';
            document.getElementById('drawerJogadores').classList.add('open');
            const lista = document.getElementById('lista-jogadores-online');
            lista.innerHTML = '<div style="color:#a0a0c0; text-align:center; margin-top:20px;">Carregando...</div>';

            const { data } = await supabaseClient.from('jogadores').select('id, nome, foto_url').order('nome');
            
            if (data && data.length > 0) {
                lista.innerHTML = '';
                data.forEach(j => {
                    const isMe = (jogadorAtual && j.id === jogadorAtual.id) ? '<span class="player-item-badge">(Você)</span>' : '';
                    const fotoUrl = (j.foto_url && !j.foto_url.includes('placeholder')) ? j.foto_url : getAvatarFallback(j.nome);
                    lista.innerHTML += `
                        <div class="player-item">
                            <img src="${fotoUrl}" onerror="this.src=getAvatarFallback('${j.nome}')">
                            <div class="player-item-info">
                                <span class="player-item-name">${j.nome}</span>
                                ${isMe}
                            </div>
                        </div>
                    `;
                });
            } else {
                lista.innerHTML = '<div style="color:#a0a0c0; text-align:center; margin-top:20px;">Vazio</div>';
            }
        }

        function fecharMenuJogadores() {
            document.getElementById('drawerOverlay').style.display = 'none';
            document.getElementById('drawerJogadores').classList.remove('open');
        }
    </script>
</body>
</html>
